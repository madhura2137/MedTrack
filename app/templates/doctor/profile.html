{% extends 'portal_base.html' %}

{% block title %}Doctor Profile - MedTrack{% endblock %}

{% block portal_content %}
<div class="mb-4">
    <h2 class="fw-bold text-dark mb-1">Doctor Profile & Credentials</h2>
    <p class="text-muted mb-0">Update your clinical qualifications, hospital affiliation, and security credentials.</p>
</div>

<div class="row g-4">
    <!-- Doctor Credentials Form -->
    <div class="col-lg-7">
        <div class="med-card bg-white p-4 h-100 border">
            <h5 class="fw-bold text-dark mb-3 border-bottom pb-2">
                <i class="bi bi-person-badge text-primary me-2"></i>Practitioner Information
            </h5>

            <form method="POST" action="{{ url_for('doctor.profile') }}">
                <input type="hidden" name="action" value="update_info">

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-medium small">Full Name</label>
                        <input type="text" class="form-control" name="name" value="{{ user.name }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-medium small">Email Address</label>
                        <input type="email" class="form-control bg-light" value="{{ user.email }}" readonly disabled>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-medium small">Phone Number</label>
                        <input type="text" class="form-control" name="phone" value="{{ user.phone }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-medium small">Medical License Number</label>
                        <input type="text" class="form-control bg-light" value="{{ profile.license_no }}" readonly disabled>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-medium small">Specialization</label>
                        <select class="form-select" name="specialization">
                            {% for spec in ['Cardiology', 'Neurology', 'General Medicine', 'Pediatrics', 'Orthopedics', 'Dermatology'] %}
                                <option value="{{ spec }}" {% if profile.specialization == spec %}selected{% endif %}>{{ spec }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-medium small">Years of Clinical Experience</label>
                        <input type="number" class="form-control" name="experience" value="{{ profile.experience }}" min="1" max="60" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-medium small">Hospital or Clinic Network Affiliation</label>
                        <input type="text" class="form-control" name="hospital" value="{{ profile.hospital }}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-medium small">Professional Clinical Bio</label>
                        <textarea class="form-control" name="bio" rows="3" placeholder="Brief summary of your clinical expertise and practice...">{{ profile.bio or '' }}</textarea>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold shadow-sm">
                    <i class="bi bi-check-lg me-1"></i> Save Profile Details
                </button>
            </form>
        </div>
    </div>

    <!-- Password Change Section -->
    <div class="col-lg-5">
        <div class="med-card bg-white p-4 h-100 border">
            <h5 class="fw-bold text-dark mb-3 border-bottom pb-2">
                <i class="bi bi-shield-lock text-danger me-2"></i>Security Credentials
            </h5>

            <form method="POST" action="{{ url_for('doctor.profile') }}">
                <input type="hidden" name="action" value="change_password">

                <div class="mb-3">
                    <label class="form-label fw-medium small">Current Password</label>
                    <input type="password" class="form-control" name="current_password" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium small">New Password</label>
                    <input type="password" class="form-control" name="new_password" placeholder="Min. 6 characters" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-medium small">Confirm New Password</label>
                    <input type="password" class="form-control" name="confirm_password" placeholder="Confirm new password" required>
                </div>

                <button type="submit" class="btn btn-outline-danger rounded-pill px-4 fw-semibold">
                    <i class="bi bi-key me-1"></i> Change Password
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
